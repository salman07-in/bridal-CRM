{% extends "base.html" %}

{% block title %}Too Many Requests (429) — {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning mb-2">429</div>
    <h3 class="fw-bold text-dark mb-2">Too Many Requests</h3>
    <p class="text-muted mb-4">Rate limit reached for security. Please pause for 60 seconds before retrying.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-salon-primary px-4">
        <i class="bi bi-arrow-repeat me-1"></i> Try Again
    </a>
</div>
{% endblock %}
