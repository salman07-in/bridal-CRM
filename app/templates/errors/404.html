{% extends "base.html" %}

{% block title %}Page Not Found (404) — {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-salon mb-2">404</div>
    <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
    <p class="text-muted mb-4">The customer record or page you requested could not be located.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-salon-primary px-4">
        <i class="bi bi-house-door me-1"></i> Return to Studio Dashboard
    </a>
</div>
{% endblock %}
