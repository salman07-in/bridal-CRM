{% extends "base.html" %}

{% block title %}Internal Server Error (500) — {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold text-dark mb-2">System Error</h3>
    <p class="text-muted mb-4">An unexpected error occurred while processing your request. The issue has been logged.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-salon-primary px-4">
        <i class="bi bi-house-door me-1"></i> Return to Studio Dashboard
    </a>
</div>
{% endblock %}
