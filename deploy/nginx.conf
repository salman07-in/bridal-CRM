# ==============================================================================
# Safiya's Makeover — Bridal CRM & Anniversary Reminder System
# Production Nginx Configuration (Oracle Linux 9 / RHEL / Ubuntu)
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=safiya_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=safiya_api:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _; # Responds to IP address and any pointing domain

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads max size for Excel/CSV registers
    client_max_body_size 16M;

    # Root Directory
    root /var/www/safiya-crm;

    # Logging
    access_log /var/log/nginx/safiya_crm_access.log combined;
    error_log /var/log/nginx/safiya_crm_error.log warn;

    # CRITICAL SECURITY: Strictly block access to sensitive files
    location ~* (\.sqlite3|\.db|\.sqlite|\.env|\.git|\.py|\.sh|instance|backups)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Serve static assets directly through Nginx with long cache
    location /static/ {
        alias /var/www/safiya-crm/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Rate-limited Login Endpoint
    location /auth/login {
        limit_req zone=safiya_login burst=3 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protected REST API for n8n / automation
    location /api/ {
        limit_req zone=safiya_api burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard Application Proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
